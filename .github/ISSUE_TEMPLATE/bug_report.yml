name: Reproducible bug
description: Capture the version, player state, reproduction, and evidence needed for a fix.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: version
    attributes:
      label: Exact installation
      description: Commit, client date and packet version, Renewal mode, local modifications, server binary and client archive hashes (attach the release identity if available).
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Starting state
      description: Map/NPC, class/level, party role, quest stage/cooldown, equipment, inventory slots/weight, materials, and zeny relevant to the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Exact reproduction steps
      description: Include timing, repeated clicks, disconnects, reconnects, and whether another player must act.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual result
      description: Include exact before/after item quantities, unique IDs, zeny, quest flags, damage, or cooldown when relevant.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Impact
      options:
        - Crash, item loss, duplication, or persistent data corruption
        - Blocked quest, instance, or core combat behavior
        - Incorrect client information, art, or navigation
        - Other reproducible behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and reproducibility
      description: Timestamp, attempts/successes, relevant log excerpt or replay, and whether reproduced in source checks, native fixture, server session, or rendered client. Exclude passwords and private player records.
  - type: textarea
    id: regression
    attributes:
      label: Fix verification
      description: Maintainer records the failing-before/passing-after test, nearby regression results, and deployment receipt here.
